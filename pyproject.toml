[project]
name = "format-kit"
version = "0.2.0"
requires-python = ">=3.8"
dependencies = ["style-profile"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools", "wheel", "style-profile @ https://github.com/Millstone123/style-profiles-data/releases/download/v2.0.0/style_profile-2.0.0-py3-none-any.whl"]
build-backend = "setuptools.build_meta"
